indexing:
  persist_dir: "./index_store"
  force_rebuild: false

retrieval:
  weight_vec: 1.25
  weight_bm25: 0.75
  original_weight: 1.0
  paraphrase_weight: 1.2
  translation_weight: 0.85
  rerank_candidates: 30
  dynamic_topk_ratio: 0.5
  rerank_alpha: 0.5
  multi_variant_rerank_enabled: false

query_expansion:
  enabled: true
  rewriter: "ollama"
  model_name: "qwen2.5:32b"
  num_paraphrases: 1
  add_translation: true
  source_lang: "auto"
  target_lang_for_translation: "auto"
  multi_turn:
    enabled: true
    max_history_turns: 5   # Keep the most recent N conversation turns

cache:
  enabled: false
  threshold: 0.92
  ttl: 86400

memory:
  enabled: true
  short_term_rounds: 5
  long_term_enabled: false

generation:
  model_name: "qwen2.5:32b"
  temperature: 0.0
  num_predict: 256

ragas_experiment:
  dataset_path: "questions/rag_memory_challenge_dataset.json"
  output_dir: "experiments/results/ragas_memory_eval"
  results_file: "evaluation_results.json"
  log_file: "experiment.log"
  doc_file: "docs/chroma/master.md"
  ollama_host: "http://127.0.0.1:11434"
  ollama_bin_dir: "~/ollama/bin"
  ollama_log_file: "~/ollama/ollama.log"
  auto_start_ollama: true
  evaluation_llm_model: "qwen2.5:32b"
  evaluation_llm_temperature: 0.0
  evaluation_embedding_model: "nomic-embed-text"
  generation_model: "qwen2.5:32b"
  generation_temperature: 0.0
  generation_num_predict: 256
  rerank_candidates: 10
  ragas_timeout_seconds: 300
  ragas_max_workers: 1
  debug_retrieval: false
  ragas_raise_exceptions: false

indexing:
  persist_dir: "./index_store"
  force_rebuild: false

retrieval:
  weight_vec: 1.25
  weight_bm25: 0.75
  rerank_candidates: 30
  rerank_alpha: 0.5
  multi_variant_rerank_enabled: false

query_expansion:
  enabled: true
  rewriter: "qwen"
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  num_paraphrases: 1
  add_translation: true
  source_lang: "auto"
  target_lang_for_translation: "auto"
  multi_turn:
    enabled: true
    max_history_turns: 5   # Keep the most recent N conversation turns

cache:
  enabled: false
  threshold: 0.92
  ttl: 86400

memory:
  enabled: true
  short_term_rounds: 5
  long_term_enabled: false

generation:
  model_name: "gemma3:4b"
  temperature: 0.0
  num_predict: 256
